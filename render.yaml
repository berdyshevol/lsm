services:
  - type: web
    runtime: node
    name: lsm
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Points at an "lsm" database of this app's own on Neon. Kept in the
      # Render dashboard rather than here because it is a secret.
      #
      # Do not replace this with a `databases:` block: Render deletes free
      # Postgres ~30 days after creation, which is what took this service down
      # for months. The database lives on Neon, which does not expire.
      - key: DATABASE_URL
        sync: false
