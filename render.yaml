services:
  - type: web
    runtime: node
    name: lsm
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Managed in the Render dashboard, not here: the connection string is a
      # secret, and Render's own free Postgres is deleted ~30 days after it is
      # created — which is exactly what took this service down. Point this at an
      # external Postgres (Neon) that does not expire.
      - key: DATABASE_URL
        sync: false
      # The Neon database is shared with other projects, so this app keeps its
      # tables in a schema of its own. Pinned here rather than in the dashboard
      # so it cannot go missing — synchronize would then target public.
      - key: DATABASE_SCHEMA
        value: lsm
